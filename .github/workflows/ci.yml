name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m maintainer_kit . --min-score 80

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: maintainer
        uses: ./
        with:
          min-score: "80"
      - name: Validate Action outputs
        shell: bash
        run: |
          test "${{ steps.maintainer.outputs.passed }}" = "true"
          test "${{ steps.maintainer.outputs.score }}" -ge 80
