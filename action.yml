name: Maintainer Kit
description: Audit repository readiness for sustainable open-source maintenance.
author: apis1357

inputs:
  min-score:
    description: Minimum acceptable score
    required: false
    default: "80"

outputs:
  score:
    description: Repository readiness score from 0 to 100
    value: ${{ steps.audit.outputs.score }}
  passed:
    description: Whether the score meets the configured minimum
    value: ${{ steps.audit.outputs.passed }}

runs:
  using: composite
  steps:
    - id: audit
      shell: bash
      run: python "$GITHUB_ACTION_PATH/run_action.py" "${{ inputs.min-score }}"
